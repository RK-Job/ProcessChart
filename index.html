<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1ヶ月工程表</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fed'/%3E%3Crect x='14' y='18' width='24' height='9' rx='4' fill='%23fff'/%3E%3Crect x='14' y='37' width='36' height='9' rx='4' fill='%23bcd2fb'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script>
(function () {
  try {
    var mode = localStorage.getItem('monthlyGanttTheme');
    if (mode === 'light' || mode === 'dark') {
      document.documentElement.dataset.theme = mode;
    }
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="toolbar no-print">
  <div class="toolbar-brand">
    <span class="app-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="5" width="12" height="4.5" rx="2" fill="currentColor"/><rect x="3" y="14.5" width="18" height="4.5" rx="2" fill="currentColor" opacity="0.55"/></svg>
    </span>
    <div class="toolbar-title-group">
      <span class="toolbar-title">1ヶ月工程表</span>
      <span class="toolbar-subtitle">Monthly Process Chart</span>
    </div>
  </div>
  <div class="toolbar-actions">
    <div class="toolbar-btn-group">
      <button id="btn-new" type="button" title="新規作成"><span class="btn-icon" aria-hidden="true">＋</span>新規作成</button>
      <button id="btn-open" type="button" title="JSONファイルを開く"><span class="btn-icon" aria-hidden="true">📂</span>開く</button>
      <input id="file-input" type="file" accept="application/json,.json" hidden>
      <button id="btn-save" type="button" title="JSONとして保存"><span class="btn-icon" aria-hidden="true">💾</span>保存</button>
      <button id="btn-print" type="button" title="印刷 / PDF出力"><span class="btn-icon" aria-hidden="true">🖨</span>印刷</button>
      <button id="btn-clear" type="button" class="danger" title="内容をすべてクリア"><span class="btn-icon" aria-hidden="true">🗑</span>クリア</button>
    </div>
    <div class="theme-switch" role="radiogroup" aria-label="表示テーマ">
      <button type="button" class="theme-option" data-theme-value="system" title="システム設定に合わせる">自動</button>
      <button type="button" class="theme-option" data-theme-value="light" title="ライトモード">ライト</button>
      <button type="button" class="theme-option" data-theme-value="dark" title="ダークモード">ダーク</button>
    </div>
  </div>
</header>

<main id="app">

  <section class="panel project-info-panel">
  <h2 class="panel-title">工事情報</h2>
  <div class="project-info no-print-border" id="project-info">
    <div class="field date-range-field">
      <label for="input-start-year">対象期間</label>
      <div class="date-range-picker">
        <div class="date-picker">
          <select id="input-start-year" aria-label="開始年"></select>
          <span>年</span>
          <select id="input-start-month" aria-label="開始月"></select>
          <span>月</span>
          <select id="input-start-day" aria-label="開始日"></select>
          <span>日</span>
        </div>
        <span class="date-range-sep">〜</span>
        <div class="date-picker">
          <select id="input-end-year" aria-label="終了年"></select>
          <span>年</span>
          <select id="input-end-month" aria-label="終了月"></select>
          <span>月</span>
          <select id="input-end-day" aria-label="終了日"></select>
          <span>日</span>
        </div>
      </div>
    </div>
    <div class="field">
      <label for="input-title">工事名称</label>
      <input id="input-title" type="text">
    </div>
    <div class="field">
      <label for="input-manager">担当者</label>
      <input id="input-manager" type="text">
    </div>
    <div class="field">
      <label for="input-company">会社名</label>
      <input id="input-company" type="text">
    </div>
  </div>
  </section>

  <section class="panel gantt-panel">
  <h2 class="panel-title">工程表</h2>
  <div class="gantt-wrapper">
    <div class="chart-grid" id="chart-grid">
      <div class="header-row" id="header-row">
        <div class="label-header">
          <span>作業項目</span>
          <button id="btn-add-row" type="button" class="no-print"><span class="btn-icon" aria-hidden="true">＋</span>行追加</button>
        </div>
        <div class="days-header-wrap">
          <div class="month-group-header" id="month-group-header"></div>
          <div class="days-header" id="days-header"></div>
        </div>
      </div>
      <div class="body-rows" id="body-rows"></div>
    </div>
  </div>
  </section>

  <section class="panel remarks-panel">
    <h2 class="panel-title">備考</h2>
    <div class="remarks-area">
      <textarea id="input-remarks" rows="3" placeholder="月間の注意事項・特記事項を入力してください"></textarea>
    </div>
  </section>

</main>

<div id="bar-modal" class="modal-overlay no-print" hidden>
  <div class="modal">
    <h3 id="modal-title">工程の追加</h3>
    <div class="field">
      <label for="modal-label">工程名</label>
      <input id="modal-label" type="text" placeholder="例: 外壁塗装">
    </div>
    <div class="field">
      <label for="modal-start-year">日程（いつから〜いつまで）</label>
      <div class="date-range-picker">
        <div class="date-picker">
          <select id="modal-start-year" aria-label="開始年"></select>
          <span>年</span>
          <select id="modal-start-month" aria-label="開始月"></select>
          <span>月</span>
          <select id="modal-start-day" aria-label="開始日"></select>
          <span>日</span>
        </div>
        <span class="date-range-sep">〜</span>
        <div class="date-picker">
          <select id="modal-end-year" aria-label="終了年"></select>
          <span>年</span>
          <select id="modal-end-month" aria-label="終了月"></select>
          <span>月</span>
          <select id="modal-end-day" aria-label="終了日"></select>
          <span>日</span>
        </div>
      </div>
    </div>
    <div class="field">
      <label>カラー</label>
      <div class="color-palette" id="color-palette"></div>
      <input id="modal-color" type="color">
    </div>
    <div class="field">
      <label>先行工程（この工程より前に終わらせる工程）</label>
      <div class="dep-list" id="modal-deps"></div>
    </div>
    <div class="modal-actions">
      <button id="modal-delete" type="button" class="danger">このバーを削除</button>
      <div class="modal-actions-right">
        <button id="modal-cancel" type="button">キャンセル</button>
        <button id="modal-ok" type="button" class="primary">OK</button>
      </div>
    </div>
  </div>
</div>

<div id="row-menu" class="row-menu no-print" hidden>
  <button type="button" id="row-menu-indent">子項目にする</button>
  <button type="button" id="row-menu-outdent">インデントを解除</button>
  <button type="button" id="row-menu-up">上へ移動</button>
  <button type="button" id="row-menu-down">下へ移動</button>
</div>

<div id="toast" class="toast no-print" hidden></div>

<script src="js/holidays.js"></script>
<script src="js/app.js"></script>
</body>
</html>
